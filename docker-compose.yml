services:
  mysql:
    image: mysql:8.0
    container_name: studenthub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_management
    ports:
      - "3307:3306"
    volumes:
      - studenthub_mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: studenthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - studenthub_redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: studenthub-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: student_management
      REDIS_URL: redis://redis:6379
      JWT_SECRET: studenthub_secret_key
    ports:
      - "5000:5000"

volumes:
  studenthub_mysql_data:
  studenthub_redis_data: